name: build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build OwaWidget.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/OwaWidget.App -c Release -r win-x64 --self-contained true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: owl-${{ github.event.pull_request.number || github.sha }}
          path: publish
          retention-days: 14
          if-no-files-found: error